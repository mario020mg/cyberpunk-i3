# Paste into ~/.config/i3/config (replaces your client.* colours and bar colours)
set $bg      #0d0221
set $bg_alt  #1f0a3d
set $fg      #e6dcff
set $muted   #6b5b95
set $accent  #ff2a9e
set $cyan    #00ebff
set $purple  #8a2be2
set $urgent  #ffd138

# class                 border   background text    indicator child_border
client.focused          $accent  $accent    $bg     $cyan     $accent
client.focused_inactive $purple  $purple    $fg     $purple   $purple
client.unfocused        $bg_alt  $bg        $muted  $bg_alt   $bg_alt
client.urgent           $urgent  $urgent    $bg     $urgent   $urgent
client.background       $bg

# Animated wallpaper + themed lock screen
exec_always --no-startup-id sh -c 'pkill -f "^python3 .*cyberpunk-wallpaper"; exec python3 $HOME/.local/bin/cyberpunk-wallpaper'
exec --no-startup-id xss-lock --transfer-sleep-lock -- $HOME/.local/bin/lock-screen --nofork
bindsym $mod+Escape exec --no-startup-id ~/.local/bin/lock-screen

bar {
        status_command i3status
        position bottom
        font pango:DejaVu Sans Mono Bold 9
        separator_symbol " ▪ "
        colors {
                background $bg
                statusline $fg
                separator  $accent
                #                  border   background text
                focused_workspace  $accent  $accent    $bg
                active_workspace   $cyan    $bg_alt    $cyan
                inactive_workspace $bg      $bg        $muted
                urgent_workspace   $urgent  $urgent    $bg
                binding_mode       $cyan    $cyan      $bg
        }
}
